<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icon -->
     <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon">
    <!-- main file -->
    <link rel="stylesheet" href="./css/main.css">

    <!-- media -->
    <link rel="stylesheet" href="./css/media.css">
    <title>What's For Dinner</title>

</head>
<body>
    
    <!-- start nav -->
    <nav class="navbar navbar-expand-lg shadow-sm d-flex " >
        <div class="container d-flex justify-content-between">
            <div class="left d-flex align-items-center">
                <div class="left-side shadow-lg d-flex align-items-center justify-content-center rounded-circle">
                    <i class="fa-solid fa-utensils text-white"></i>
                </div>
                
                <div class="right-side d-flex justify-content-center flex-column">
                    <h3 class="navbar-brand fw-bold mb-0" href="#">What's For Dinner</h3>
                    <p class="text-start mt-0 ">Your daily meal inspiration</p>
                </div>
            </div>
          
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse " id="navbarNav">
              <div class="right ms-auto d-flex">
                <button class="border-0 bg-transparent">
                    <i class="fa-solid fa-bookmark"></i>
                  </button>

                  <button class="border-0 bg-transparent">
                    <i class="text-base md:text-xl time" data-fa-i2svg=""><svg class="svg-inline--fa fa-clock-rotate-left" aria-hidden="true" focusable="false" data-prefix="fas" data-icon="clock-rotate-left" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-fa-i2svg=""><path fill="currentColor" d="M75 75L41 41C25.9 25.9 0 36.6 0 57.9V168c0 13.3 10.7 24 24 24H134.1c21.4 0 32.1-25.9 17-41l-30.8-30.8C155 85.5 203 64 256 64c106 0 192 86 192 192s-86 192-192 192c-40.8 0-78.6-12.7-109.7-34.4c-14.5-10.1-34.4-6.6-44.6 7.9s-6.6 34.4 7.9 44.6C151.2 495 201.7 512 256 512c141.4 0 256-114.6 256-256S397.4 0 256 0C185.3 0 121.3 28.7 75 75zm181 53c-13.3 0-24 10.7-24 24V256c0 6.4 2.5 12.5 7 17l72 72c9.4 9.4 24.6 9.4 33.9 0s9.4-24.6 0-33.9l-65-65V152c0-13.3-10.7-24-24-24z"></path></svg></i>
                  </button>

                  <button class="border-0 bg-transparent">
                    <i class="text-base md:text-xl setting" data-fa-i2svg=""><svg class="svg-inline--fa fa-gear" aria-hidden="true" focusable="false" data-prefix="fas" data-icon="gear" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-fa-i2svg=""><path fill="currentColor" d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"></path></svg></i>
                  </button>

                  <div class="img  ">
                    <img class="w-100 rounded-circle " src="./img/avatar-2.jpg">
                  </div>
              </div>
          
          </div>
        </div>
      </nav>
    <!-- end nav  -->

    <!-- start section -->
     <section class="main-section">

        <div class="container h-100">

          <div class="meal h-100 d-flex flex-column flex-lg-row">

            <div class="col-lg-5 col  h-100">

              <div class="left-part mb-0 h-100">


                <div class="img position-relative h-100">
                   <img class="w-100 h-100 object-fit-cover" id="picture" src="" alt="a meal">

                   <div class="position-absolute rates bg-white rounded-pill d-flex gap-2 py-2 px-3 align-items-center">
                        <i class="fa-solid fa-star"></i>
                        <span id="rate">
                        </span>
                        <span id="reviews"></span>
  
                  </div>
  
                  <div class="features text-center position-absolute bg-white rounded-3 d-flex gap-3  pt-md-4 pb-md-4 justify-content-around">
                      <div id="prep">
                         <i class="fa-solid fa-clock icon"></i>
                         <p class="mb-0 text-nowrap">Prep Time</p>
                         <span class="fw-bold" id="prep-time"></span>
                      </div>
  
                      <div id="cook">
                         <i class="fa-solid fa-fire-burner icon"></i>
                         <p class="mb-0 text-nowrap">Cook Time</p>
                         <span class="fw-bold" id="cook-time"></span>
                      </div>
   
                      <div id="serving">
                        <i class="fa-solid fa-users icon"></i>
                        <p class="mb-0 text-nowrap">Servings</p>
                        <span class="fw-bold text-nowrap" id="servings"></span>
                      </div>
                  </div>
             
                </div>

            

               

              </div>
            </div>
        
  
  
            <div class="col-lg-7 col mt-0 h-100">
              <div class="right-part bg-white rounded-end-4 overflow-auto h-100">
  
                <div class="first d-flex">
                  <div class="level">
                      <span id="level" class="rounded-pill"></span>
                  </div>
  
                  <div class="country">
                      <span id="country" class="rounded-pill"></span>
                  </div>
                </div>

                <div class="second d-flex justify-content-between mb-4">

                  <div class="title">
                    <h1 class="fw-bold" id="meal-title">
                    </h1>
                    <p id="des"></p>
                  </div>

                  <div class="icons d-flex gap-2">

                      <button id="save"  class="border-0 rounded-3">
                         <i class="fa-solid fa-bookmark"></i>
                      </button>

                      <button id="share" class="border-0 rounded-3">
                          <i class="fa-solid fa-share-nodes"></i>
                      </button>
                  </div>
                </div>
               

                <div class="preparation-time p-3 rounded-2 mb-4 align-items-center " id="preparation-time">
                       <i class="fa-solid fa-triangle-exclamation"></i>
                       
                       <div id="detailsPreparationTime">
                            <h3 id="extend" class="mb-0"></h3>
                            <p id="require"></p>
                       </div>
                </div>
                

                <!-- tabs -->

                <div class="tabs">

                  <ul class="nav nav-tabs p-3 mb-4 flex-nowrap" id="myTab" role="tablist">
                    <li class="nav-item col-3 text-truncate" role="presentation">
                      <button class="nav-link active fw-semibold " id="home-tab" data-bs-toggle="tab" data-bs-target="#home-tab-pane" type="button" role="tab" aria-controls="home-tab-pane" aria-selected="true">
                        <i class="fa-solid fa-list-check"></i> 
                        <span>Ingredients</span>
                      </button>
                    </li>
                    <li class="nav-item col-3 text-truncate" role="presentation">
                      
                      <button class="nav-link fw-semibold " id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab" aria-controls="profile-tab-pane" aria-selected="false">
                        <i class="fa-solid fa-book-open"></i>
                        Instructions</button>
                    </li>
                    <li class="nav-item col-3 text-truncate" role="presentation">
                      <button class="nav-link fw-semibold " id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact-tab-pane" type="button" role="tab" aria-controls="contact-tab-pane" aria-selected="false">
                        <i class="fa-solid fa-chart-pie"></i>
                        Nutrition</button>
                    </li>
                    <li class="nav-item col-3 text-truncate" role="presentation">
                      <button class="nav-link fw-semibold " id="tips-tab" data-bs-toggle="tab" data-bs-target="#tips-tab-pane" type="button" role="tab" aria-controls="tips-tab-pane" aria-selected="false" >
                        <i class="fa-solid fa-lightbulb"></i>
                        Chef's Tips</button>
                    </li>
                  </ul>
                  <div class="tab-content " id="myTabContent">
                    <div class="tab-pane h-100 fade show active p-4 rounded-4 overflow-auto " id="home-tab-pane" role="tabpanel" aria-labelledby="home-tab" tabindex="0">
                      
                        <ol id="ingredients-list">


                             
                        </ol>

                    </div>


                    <div class="tab-pane fade h-100 overflow-auto" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
                         
                      <ol id="instructions-list">


                             
                      </ol>
                     </div>
                    <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab" tabindex="0">...</div>
                    <div class="tab-pane fade" id="tips-tab-pane" role="tabpanel" aria-labelledby="tips-tab" tabindex="0">...</div>
                  </div>
  


                </div>
             


    
                <div class="another-recipe">
                  <button id="another-recipe" class="border-0" onclick="displayMeal()">
                    <i class="fa-solid fa-repeat"></i>
                    Try another Recipe</button>
                </div>
                
              </div>
         
            </div>
           
        </div>
  
        </div>
      
     </section>
    <!-- end section -->
      <script src="./js/bootstrap.bundle.min.js"></script>
      <script src="./js/all.min.js"></script>
      <script src="./js/main.js"></script>
</body>
</html>
